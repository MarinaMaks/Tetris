<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Тетрис</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            touch-action: none; /* Отключаем скролл страницы */
        }
        
        canvas {
            border: 2px solid lime;
            image-rendering: pixelated;
            max-width: 95vw;
            max-height: 85vh;
            box-sizing: border-box;
        }

        .start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .start-screen h1 { font-size: 2em; margin-bottom: 10px; text-shadow: 0 0 10px lime; }
        .start-screen p { opacity: 0.7; margin-bottom: 5px; }

        .controls-mobile {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 15px;
            z-index: 10;
            opacity: 0.8;
            pointer-events: none; /* Кнопки не активны на стартовом экране */
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto; /* Включаем события для самих кнопок */
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.3); }

        #gameOverModal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border: 2px solid red;
            text-align: center;
            display: none;
            z-index: 20;
            min-width: 80vw;
        }
        #scoreBoard ol {
            list-style-position: inside;
            padding-left: 0;
            color: cyan;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="start-screen" id="startScreen">
    <h1>🧱 ТЕТРИС</h1>
    <p>Управление: экранные кнопки внизу</p>
    <p style="font-size:0.9em;">Нажмите в любом месте экрана, чтобы начать</p>
</div>

<canvas id="gameCanvas"></canvas>

<!-- Блок кнопок всегда есть в DOM, но виден только когда запущена игра -->
<div class="controls-mobile" id="mobileControls">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>

<div id="gameOverModal">
    <h2 style="color:red;">GAME OVER</h2>
    <p>Ваш счет: <span id="finalScore"></span></p>
    <h3>Лучшие результаты:</h3>
    <div id="scoreBoard"><ol></ol></div>
    <button id="resetButton" onclick="resetGame()" style="margin-top:20px;padding:10px 20px;background:lime;border:none;font-weight:bold;cursor:pointer;">Играть снова</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const finalScoreSpan = document.getElementById('finalScore');
const scoreList = document.querySelector('#scoreBoard ol');
const gameOverModal = document.getElementById('gameOverModal');
const mobileControls = document.getElementById('mobileControls');
const startScreen = document.getElementById('startScreen');

// Настройки сетки
const ROWS = 20;
const COLS = 10;
const SQ = Math.floor(window.innerWidth * 0.8 / COLS); 
canvas.width = COLS * SQ;
canvas.height = ROWS * SQ;

let board = [];
let score = 0;
let dropInterval = 800; // Скорость падения в мс
let fallTimer = null;
let gameActive = false;

// Матрицы фигур
function Z(){return [[2,2,0],[0,2,2],[0,0,0]];}
function S(){return [[0,2,2],[2,2,0],[0,0,0]];}
function T(){return [[0,2,0],[2,2,2],[0,0,0]];}
function O(){return [[2,2],[2,2]];}
function L(){return [[0,0,2],[2,2,2],[0,0,0]];}
function I(){return [[0,0,0,0],[2,2,2,2],[0,0,0,0],[0,0,0,0]];}
function J(){return [[2,0,0],[2,2,2],[0,0,0]];}

// Цвета [Матрица, "Цвет"]
const PIECES = [
    [Z, "red"], 
    [S, "lime"],
    [T, "yellow"],
    [O, "blue"],
    [L, "purple"], 
    [I, "cyan"],
    [J, "orange"]
];

let activePiece;

// Инициализация пустого поля
for (let r = 0; r < ROWS; r++) {
    board[r] = new Array(COLS).fill(0);
}

/* --- ЗАПУСК ИГРЫ --- */
document.body.addEventListener('pointerdown', function(e) {
    // Игнорируем нажатие на кнопку "Играть снова", чтобы не было двойного срабатывания
    if (!gameActive && e.target.id !== 'resetButton') {
        e.preventDefault();
        hideStartScreen();
        setupGame();
    }
});

function hideStartScreen() {
    startScreen.style.display = 'none';
    mobileControls.style.opacity = '1'; /* Показываем кнопки плавно */
}

function setupGame() {
    gameActive = true;
    score = 0;
    dropInterval = 800;
    
    // Чистим поле
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            board[r][c] = 0;
        }
    }
    
    activePiece = createPiece();
    renderScores();
    
    clearInterval(fallTimer);
    fallTimer = setInterval(() => {
        moveDown();
    }, dropInterval);
    
    requestAnimationFrame(gameLoop);
}

/* --- ЛОГИКА ФИГУР --- */
function createPiece() {
    const index = Math.floor(Math.random() * PIECES.length);
    return new Piece(PIECES[index][0], PIECES[index][1]);
}

class Piece {
    constructor(tetromino, color) {
        this.tetromino = tetromino;
        this.color = color;
        this.activeTetromino = 0;
        this.x = 3;
        this.y = -2;
    }
    
    fill(colorVal) {
        for (let r = 0; r < this.tetromino[this.activeTetromino].length; r++) {
            for (let c = 0; c < this.tetromino[this.activeTetromino][r].length; c++) {
                if (this.tetromino[this.activeTetromino][r][c]) {
                    drawSquare(this.x + c, this.y + r, colorVal);
                }
            }
        }
    }
    draw() { this.fill(this.color); }
    undraw() { this.fill(0); }

    moveDown() {
        if (!this.collision(0, 1, this.activeTetromino)) {
            this.undraw();
            this.y++;
            this.draw();
        } else {
            this.lock();
            pSweep();
            activePiece = createPiece();
            if (this.collision(0, 0, this.activeTetromino)) {
                endGame();
            }
        }
    }
    moveLeft() { if (!this.collision(-1, 0, this.activeTetromino)) { this.undraw(); this.x--; this.draw(); } }
    moveRight() { if (!this.collision(1, 0, this.activeTetromino)) { this.undraw(); this.x++; this.draw(); } }
    
    rotate() {
        let nextPattern = (this.activeTetromino + 1) % this.tetromino.length;
        let kick = 0;
        if (this.collision(0, 0, nextPattern)) {
            this.x > COLS / 2 ? kick = -1 : kick = 1;
        }
        if (!this.collision(kick, 0, nextPattern)) {
            this.undraw();
            this.x += kick;
            this.activeTetromino = nextPattern;
            this.draw();
        }
    }

    collision(offsetX, offsetY, pattern) {
        for (let r = 0; r < this.tetromino[pattern].length; r++) {
            for (let c = 0; c < this.tetromino[pattern][r].length; c++) {
                if (!this.tetromino[pattern][r][c]) continue;
                let newX = this.x + c + offsetX;
                let newY = this.y + r + offsetY;
                if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                if (newY < 0) continue;
                if (board[newY][newX] !== 0) return true;
            }
        }
        return false;
    }

    lock() {
        for (let r = 0; r < this.tetromino[this.activeTetromino].length; r++) {
            for (let c = 0; c < this.tetromino[this.activeTetromino][r].length; c++) {
                if (!this.tetromino[this.activeTetromino][r][c]) continue;
                if (this.y + r < 0) break;
                board[this.y + r][this.x + c] = this.color;
            }
        }
    }
}

/* --- РЕНДЕР --- */
function drawSquare(x, y, color) {
    ctx.fillStyle = color === 0 ? '#000' : color;
    ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
}

function drawBoard() {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            drawSquare(c, r, board[r][c]);
        }
    }
}

/* --- ОЧИСТКА РЯДОВ (+10 очков) --- */
function pSweep() {
    let rowCount = 0;
    for (let r = 0; r < ROWS; r++) {
        let isRowFull = true;
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] === 0) { isRowFull = false; break; }
        }
        if (isRowFull) {
            for (let y = r; y > 1; y--) {
                for (let c = 0; c < COLS; c++) {
                    board[y][c] = board[y-1][c];
                }
            }
            for (let c = 0; c < COLS; c++) { board[0][c] = 0; }
            rowCount++;
        }
    }
    if (rowCount > 0) {
        score += rowCount * 10;
    }
}

/* --- КОНЕЦ ИГРЫ --- */
function endGame() {
    gameActive = false;
    clearInterval(fallTimer);
    saveScore(score);
    finalScoreSpan.textContent = score;
    renderScores();
    gameOverModal.style.display = 'block';
}

/* --- УПРАВЛЕНИЕ --- */
function moveLeft() { if (gameActive) activePiece.moveLeft(); }
function moveRight() { if (gameActive) activePiece.moveRight(); }
function moveDown() { if (gameActive) activePiece.moveDown(); }
function rotatePiece() { if (gameActive) activePiece.rotate(); }

/* --- ЦИКЛ ОТРИСОВКИ --- */
function gameLoop() {
    if (!gameActive) return;
    drawBoard();
    activePiece.draw();
    requestAnimationFrame(gameLoop);
}

/* --- СБРОС И РЕЙТИНГ --- */
function resetGame() {
    gameOverModal.style.display = 'none';
    showStartScreen();
}

function showStartScreen() {
    startScreen.style.display = 'flex';
    mobileControls.style.opacity = '0.3'; /* Приглушаем кнопки на старте */
    gameActive = false;
    clearInterval(fallTimer);
}

function saveScore(newScore) {
    let scores = JSON.parse(localStorage.getItem('tetrisScores')) || [];
    scores.push(newScore);
    scores.sort((a, b) => b - a);
    localStorage.setItem('tetrisScores', JSON.stringify(scores.slice(0, 5)));
}

function renderScores() {
    scoreList.innerHTML = '';
    let scores = JSON.parse(localStorage.getItem('tetrisScores')) || [];
    scores.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        scoreList.appendChild(li);
    });
}
renderScores();

</script>

</body>
</html>
