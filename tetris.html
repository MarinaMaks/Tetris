<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис</title>
    <!-- Этот мета-тег обязателен для корректного масштаба на смартфоне -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        /* Убираем стандартные отступы */
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Холст всегда виден и имеет рамку для проверки границ */
        canvas {
            border: 2px solid lime;
            image-rendering: pixelated;
            max-width: 95vw;
            max-height: 90vh;
        }
        
        /* Кнопки управления видны сразу */
        .controls-mobile {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 15px;
            z-index: 10;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<!-- Весь игровой скрипт перенесен вниз, чтобы страница успела прогрузиться -->
<body>

<canvas id="gameCanvas"></canvas>

<div class="controls-mobile">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>

<script>
// --- НАСТРОЙКИ ---
const ROWS = 20;
const COLS = 10;
let SQ; // Размер одной клетки

// --- ПОИСК ЭЛЕМЕНТОВ ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Адаптивный размер под экран телефона
function resizeCanvas() {
    const w = window.innerWidth * 0.9;
    SQ = Math.floor(w / COLS);
    canvas.width = COLS * SQ;
    canvas.height = ROWS * SQ;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- ПОЛЕ И ЦВЕТА ---
let board = [];
for (let r = 0; r < ROWS; r++) {
    board[r] = new Array(COLS).fill(0);
}

const PIECES = [
    [[[2,2,0],[0,2,2],[0,0,0]], "red"], 
    [[[0,2,2],[2,2,0],[0,0,0]], "lime"],
    [[[0,2,0],[2,2,2],[0,0,0]], "yellow"],
    [[[2,2],[2,2]], "blue"],
    [[[0,0,2],[2,2,2],[0,0,0]], "purple"], 
    [[[0,0,0,0],[2,2,2,2],[0,0,0,0],[0,0,0,0]], "cyan"],
    [[[2,0,0],[2,2,2],[0,0,0]], "orange"]
];

// --- РИСОВАНИЕ ---
function drawSquare(x, y, color) {
    if (color === 0) {
        ctx.fillStyle = '#000';
    } else {
        ctx.fillStyle = color;
    }
    ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
}

function drawBoard() {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            drawSquare(c, r, board[r][c]);
        }
    }
}

// --- ФИГУРА ---
class Piece {
    constructor(tetromino, color) {
        this.tetromino = tetromino;
        this.color = color;
        this.activeTetromino = 0;
        this.x = 3;
        this.y = -2;
    }
    fill(colorVal){ 
        for(let r=0; r<this.tetromino[this.activeTetromino].length; r++){
            for(let c=0; c<this.tetromino[this.activeTetromino][r].length; c++){
                if(this.tetromino[this.activeTetromino][r][c]) drawSquare(this.x+c, this.y+r, colorVal);
            }
        }
    }
    draw(){ this.fill(this.color); }
    undraw(){ this.fill(0); }
    moveDown(){
        if(!this.collision(0, 1, this.activeTetromino)){
            this.undraw(); this.y++; this.draw();
        } else {
            this.lock(); pSweep(); activePiece = createPiece();
        }
    }
    moveLeft(){ if(!this.collision(-1, 0, this.activeTetromino)){ this.undraw(); this.x--; this.draw(); } }
    moveRight(){ if(!this.collision(1, 0, this.activeTetromino)){ this.undraw(); this.x++; this.draw(); } }
    rotate(){
        let nextPattern = (this.activeTetromino + 1) % this.tetromino.length;
        let kick = 0;
        if(this.collision(0, 0, nextPattern)) this.x > COLS / 2 ? kick = -1 : kick = 1;
        if(!this.collision(kick, 0, nextPattern)){
            this.undraw(); this.x += kick; this.activeTetromino = nextPattern; this.draw();
        }
    }
    collision(offsetX, offsetY, pattern){
        for(let r=0; r<this.tetromino[pattern].length; r++){
            for(let c=0; c<this.tetromino[pattern][r].length; c++){
                if(!this.tetromino[pattern][r][c]) continue;
                let newX = this.x + c + offsetX;
                let newY = this.y + r + offsetY;
                if(newX < 0 || newX >= COLS || newY >= ROWS) return true;
                if(newY < 0) continue;
                if(board[newY][newX] !== 0) return true;
            }
        }
        return false;
    }
    lock(){
        for(let r=0; r<this.tetromino[this.activeTetromino].length; r++){
            for(let c=0; c<this.tetromino[this.activeTetromino][r].length; c++){
                if(!this.tetromino[this.activeTetromino][r][c]) continue;
                if(this.y + r < 0) break;
                board[this.y + r][this.x + c] = this.color;
            }
        }
    }
}

function createPiece() {
    const index = Math.floor(Math.random() * PIECES.length);
    return new Piece(PIECES[index][0], PIECES[index][1]);
}

// --- ЛОГИКА ИГРЫ ---
let activePiece = createPiece();
let dropInterval = 800;
let lastTime = 0;

function gameLoop(timeStamp = 0) {
    const deltaTime = timeStamp - lastTime;
    if (deltaTime > dropInterval) {
        moveDown();
        lastTime = timeStamp;
    }
    drawBoard();
    activePiece.draw();
    requestAnimationFrame(gameLoop);
}

function moveDown() { activePiece.moveDown(); }
function moveLeft() { activePiece.moveLeft(); }
function moveRight() { activePiece.moveRight(); }
function rotatePiece() { activePiece.rotate(); }

function pSweep() {
    let rowCount = 0;
    for (let r = 0; r < ROWS; r++) {
        let isRowFull = true;
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] === 0) { isRowFull = false; break; }
        }
        if (isRowFull) {
            for (let y = r; y > 1; y--) {
                for (let c = 0; c < COLS; c++) {
                    board[y][c] = board[y-1][c];
                }
            }
            for (let c = 0; c < COLS; c++) { board[0][c] = 0; }
            rowCount++;
        }
    }
    if (rowCount > 0) {
        console.log("Ряд удален! +" + (rowCount * 10));
    }
}

// Запускаем цикл рисования
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
