<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис - DEBUG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        canvas {
            border: 4px solid lime;
            image-rendering: pixelated;
            width: 360px;
            height: 640px;
            box-sizing: border-box;
            z-index: 10;
            background-color: #000;
        }

        .controls-mobile {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: auto auto auto; gap: 15px; z-index: 20;
            pointer-events: none; transition: opacity 0.3s;
        }
        .controls-mobile.active { pointer-events: all; opacity: 1; }
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%; 
            border: 3px solid white; background: rgba(255,255,255,0.2); 
            color: white; font-size: 24px; cursor: pointer;
        }
        .control-btn:active { background: rgba(255,255,255,0.4); }

        #game-over-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(50,0,0,0.95); color: red; padding: 30px; border: 3px solid red; z-index: 100; display: none;
        }
        #debug-log {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; 
            border: 1px solid yellow; font-size: 12px; color: yellow; z-index: 200; max-height: 200px; overflow-y: auto;
        }
    </style>
</head>
<body>

<div id="score">ОЧКИ: 0</div>
<div id="debug-log"></div>
<canvas id="gameCanvas"></canvas>
<div class="controls-mobile inactive" id="controls">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>
<div id="game-over-modal"><h2>КОНЕЦ ИГРЫ</h2><p id="final-score"></p><button onclick="resetGame()">ЗАНОВО</button></div>

<script defer>
const log = document.getElementById('debug-log');
function addLog(text) {
    const time = new Date().toLocaleTimeString();
    log.innerHTML += `[${time}] ${text}<br>`;
}

addLog("Инициализация...");

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
if (!ctx) {
    addLog("FATAL: Canvas context is null!");
    return;
}

// --- ЖЕСТКИЕ ПАРАМЕТРЫ ---
const ROWS = 20, COLS = 10, SQ = 32;
let board = [];
for(let r=0;r<ROWS;r++) board[r] = new Array(COLS).fill(0);

// --- ФИГУРА (минималистичная) ---
class Piece {
    constructor(){ this.x=3; this.y=0; this.color='red'; this.shape=[[1,1,0],[0,1,1],[0,0,0]]; }
    draw(){
        try {
            // Принудительная очистка цветом фона (решение проблемы прозрачных контекстов)
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            addLog(`Попытка рисования (${this.x}, ${this.y}) цвет: ${this.color}`);
            
            for(let r=0; r<this.shape.length; r++){
                for(let c=0; c<this.shape[r].length; c++){
                    if(this.shape[r][c]){
                        let px = (this.x + c) * SQ;
                        let py = (this.y + r) * SQ;
                        
                        // Проверка границ внутри цикла
                        if(px >= 0 && py >= 0 && px < canvas.width && py < canvas.height){
                            ctx.fillStyle = this.color;
                            ctx.fillRect(px, py, SQ, SQ);
                            ctx.strokeStyle = 'white';
                            ctx.strokeRect(px, py, SQ, SQ);
                            addLog(`Нарисован квадрат at [${px}, ${py}]`);
                        } else {
                            addLog(`SKIP: Квадрат за пределами экрана at [${px}, ${py}]`);
                        }
                    }
                }
            }
        } catch(e) {
            addLog("ERROR in Draw(): " + e.message);
        }
    }
}

let activePiece = new Piece();
let gameActive = true;

// --- ЦИКЛ ---
function gameLoop(){
    if(!gameActive) return;
    activePiece.draw(); 
    requestAnimationFrame(gameLoop);
}

// Запускаем через таймер, чтобы DOM точно успел прорисоваться
setTimeout(() => {
    addLog("Запуск игрового цикла...");
    gameLoop();
}, 100);

// Управление (для теста появления кнопок)
function moveLeft(){ addLog("Нажата кнопка Влево"); }
function moveRight(){ addLog("Нажата кнопка Вправо"); }
function rotatePiece(){ addLog("Нажата кнопка Вращать"); }

</script>

</body>
</html>
