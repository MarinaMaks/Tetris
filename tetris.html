<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис (Движок Арканоида)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        body { 
            margin: 0; background-color: #000; color: white; font-family: monospace; 
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative;
        }
        
        canvas {
            border: 4px solid lime;
            image-rendering: pixelated;
            width: 360px;
            height: 640px;
            box-sizing: border-box;
            z-index: 10;
            background-color: #000;
        }

        .controls-mobile {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: auto auto auto; gap: 15px; z-index: 20;
            pointer-events: none; transition: opacity 0.3s;
        }
        .controls-mobile.active { pointer-events: all; opacity: 1; }
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%; 
            border: 3px solid white; background: rgba(255,255,255,0.2); 
            color: white; font-size: 24px; cursor: pointer;
        }
        .control-btn:active { background: rgba(255,255,255,0.4); }

        #game-over-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(50,0,0,0.95); color: red; padding: 30px; border: 3px solid red; z-index: 100; display: none;
            text-align: center;
        }
        #score { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 24px; z-index: 50; padding: 10px 20px; background: rgba(0,0,0,0.7); border: 2px solid lime; border-radius: 10px; }
    </style>
</head>
<body>

<div id="score">ОЧКИ: 0</div>
<canvas id="gameCanvas"></canvas>
<div class="controls-mobile inactive" id="controls">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>
<div id="game-over-modal"><h2>КОНЕЦ ИГРЫ</h2><p id="final-score"></p><button onclick="resetGame()">ИГРАТЬ СНОВА</button></div>

<script defer>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');
const gameOverModal = document.getElementById('game-over-modal');
const finalScoreSpan = document.getElementById('final-score');
const controls = document.getElementById('controls');

// --- НАСТРОЙКИ АРКАНОИДА ---
const ROWS = 20;
const COLS = 10;
const SQ = 32; // Размер клетки строго в пикселях

canvas.width = COLS * SQ;
canvas.height = ROWS * SQ;

let board = [];
for(let r=0; r<ROWS; r++){ board[r] = new Array(COLS).fill(0); }

// --- ФИГУРЫ ПРОСТЫМ СПИСКОМ КООРДИНАТ (как мячик в арканоиде) ---
// Вместо матриц [1,0,1], используем готовые смещения блоков относительно центра
const SHAPES = [
    // Z-фигурка (красная)
    {coords: [[0,0],[1,0],[1,1],[2,1]], color: 'red'},
    // L-фигурка (синяя)
    {coords: [[0,1],[0,2],[1,0],[1,1]], color: 'blue'},
    // Гамма (зеленая)
    {coords: [[0,0],[0,1],[1,1],[2,1]], color: 'lime'},
    // Куб (желтый)
    {coords: [[0,0],[0,1],[1,0],[1,1]], color: 'yellow'},
    // Палка (голубая)
    {coords: [[0,0],[1,0],[2,0],[3,0]], color: 'cyan'},
    // Т-фигурка (фиолетовая)
    {coords: [[0,0],[1,0],[2,0],[1,1]], color: 'purple'},
    // S-фигурка (оранжевая)
    {coords: [[1,0],[2,0],[0,1],[1,1]], color: 'orange'}
];

// --- ОТРИСОВКА (Метод Арканоида: одна функция на всё) ---
function drawRect(x, y, color){
    if(!ctx) return;
    ctx.fillStyle = color;
    ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
}

// Отрисовка целого игрового поля
function drawBoard(){
    for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
            if(board[r][c]){
                drawRect(c, r, board[r][c]);
            }
        }
    }
}

// --- ОБЪЕКТ ФИГУРЫ ---
let activePiece = null;
let dropInterval = 800;
let lastTime = 0;
let gameScore = 0;
let gameActive = false;
let fallTimer = null;

function createPiece(){
    const index = Math.floor(Math.random() * SHAPES.length);
    const shape = SHAPES[index];
    return {
        x: Math.floor(COLS / 2) - 2, // Стартовая позиция X
        y: 0,                        // Наверху
        coords: shape.coords,
        color: shape.color
    };
}

// Функция рисования текущей падающей фигуры
function drawPiece(piece){
    piece.coords.forEach(block => {
        let px = piece.x + block[0];
        let py = piece.y + block[1];
        // Проверяем границы, чтобы не упасть в ошибку за пределами холста
        if(px >= 0 && py >= 0 && px < COLS && py < ROWS){
            drawRect(px, py, piece.color);
        }
    });
}

// Проверка столкновений (упрощенная)
function checkCollision(piece, offsetX, offsetY){
    for(let i=0; i<piece.coords.length; i++){
        let px = piece.x + piece.coords[i][0] + offsetX;
        let py = piece.y + piece.coords[i][1] + offsetY;
        
        if(px < 0 || px >= COLS || py >= ROWS) return true;
        if(py >= 0 && board[py][px]) return true;
    }
    return false;
}

// --- ЛОГИКА ДВИЖЕНИЯ ---
function moveDown(){
    if(!checkCollision(activePiece, 0, 1)){
        activePiece.y++;
    } else {
        lockPiece();
        clearLines();
        activePiece = createPiece();
        if(checkCollision(activePiece, 0, 0)) endGame();
    }
}
function moveLeft(){ if(!checkCollision(activePiece, -1, 0)) activePiece.x--; }
function moveRight(){ if(!checkCollision(activePiece, 1, 0)) activePiece.x++; }
function rotatePiece(){
    // В этой упрощенной версии пока пропустим вращение для стабильности
}

// "Заморозка" фигуры доске
function lockPiece(){
    activePiece.coords.forEach(block => {
        let px = activePiece.x + block[0];
        let py = activePiece.y + block[1];
        if(py >= 0) board[py][px] = activePiece.color;
    });
}

// Очистка рядов (+10 очков)
function clearLines(){
    let rowCount = 0;
    outer: for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
            if(!board[r][c]) continue outer;
        }
        // Ряд полон
        for(let y=r; y > 0; y--){
            board[y] = [...board[y-1]];
        }
        board[0] = new Array(COLS).fill(0);
        rowCount++;
    }
    if(rowCount > 0){
        gameScore += rowCount * 10;
        scoreDiv.textContent = "ОЧКИ: " + gameScore;
    }
}

// --- ЦИКЛ ИГРЫ ---
function gameLoop(timeStamp = 0){
    if(!gameActive) return;
    
    const delta = timeStamp - lastTime;
    if(delta > dropInterval){
        lastTime = timeStamp;
        moveDown();
    }
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height); // Принудительная очистка кадра
    drawBoard();
    drawPiece(activePiece);
    
    requestAnimationFrame(gameLoop);
}

function startGame(){
    gameActive = true;
    activePiece = createPiece();
    updateScore();
    requestAnimationFrame(gameLoop);
    fallTimer = setInterval(moveDown, dropInterval);
    controls.classList.remove('inactive'); controls.classList.add('active');
}

function endGame(){
    gameActive = false;
    clearInterval(fallTimer);
    finalScoreSpan.textContent = `ВАШ СЧЕТ: ${gameScore}`;
    gameOverModal.style.display = 'flex';
    controls.classList.remove('active'); controls.classList.add('inactive');
}

function resetGame(){
    gameOverModal.style.display = 'none';
    board = []; 
    for(let r=0; r<ROWS; r++) board[r] = new Array(COLS).fill(0);
    gameScore = 0;
    startGame();
}

function updateScore(){
    scoreDiv.textContent = "ОЧКИ: " + gameScore;
}

// --- ЗАПУСК ---
document.addEventListener('DOMContentLoaded', () => {
    addLog("Старт...");
    startGame();
});

// Для диагностики (можно удалить если заработает)
function addLog(msg){ /* console.log(msg); */ }

</script>

</body>
</html>
