<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        #score {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            z-index: 50;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid lime;
            border-radius: 10px;
        }

        canvas {
            border: 3px solid lime;
            image-rendering: pixelated;
            max-width: 95vw;
            max-height: 80vh;
            box-sizing: border-box;
            z-index: 10;
        }

        .controls-mobile {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 15px;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .controls-mobile.active { pointer-events: all; opacity: 1; }
        .controls-mobile.inactive { pointer-events: none; opacity: 0.3; }

        .control-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid white;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 28px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.4); }

        /* Экран конца игры */
        #game-over-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: red;
            padding: 30px 40px;
            border: 3px solid red;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        #final-score { font-size: 28px; font-weight: bold; }
        #restart-btn {
            padding: 12px 30px;
            background: lime;
            color: black;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        #restart-btn:hover { background: #aaffaa; }
    </style>
</head>
<body>

<div id="score">ОЧКИ: 0</div>
<canvas id="gameCanvas"></canvas>
<div class="controls-mobile inactive" id="controls">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>
<div id="game-over-modal">
    <h2 style="margin:0;">КОНЕЦ ИГРЫ</h2>
    <p id="final-score"></p>
    <button id="restart-btn" onclick="resetGame()">ИГРАТЬ СНОВА</button>
</div>

<script>
try {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDiv = document.getElementById('score');
    const gameOverModal = document.getElementById('game-over-modal');
    const finalScoreSpan = document.getElementById('final-score');
    const controls = document.getElementById('controls');

    const ROWS = 20;
    const COLS = 10;
    let SQ;

    function resizeCanvas() {
        const w = window.innerWidth * 0.9;
        SQ = Math.max(20, Math.floor(w / COLS));
        canvas.width = COLS * SQ;
        canvas.height = ROWS * SQ;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // --- ПОЛЕ ---
    let board = [];
    for (let r = 0; r < ROWS; r++) {
        board[r] = new Array(COLS).fill(0);
    }

    // --- ФИГУРЫ [Матрица, Цвет] ---
    const PIECES = [
        [ [[2,2,0],[0,2,2],[0,0,0]], "red"], 
        [ [[0,2,2],[2,2,0],[0,0,0]], "lime"],
        [ [[0,2,0],[2,2,2],[0,0,0]], "yellow"],
        [ [[2,2],[2,2]], "blue"],
        [ [[0,0,2],[2,2,2],[0,0,0]], "purple"], 
        [ [[0,0,0,0],[2,2,2,2],[0,0,0,0],[0,0,0,0]], "cyan"],
        [ [[2,0,0],[2,2,2],[0,0,0]], "orange"]
    ];

    // --- РИСОВАНИЕ ---
    function drawSquare(x, y, color){
        if (!ctx) return;
        ctx.fillStyle = color === 0 ? '#000' : color;
        ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
    }
    function drawBoard(){
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                drawSquare(c, r, board[r][c]);
            }
        }
    }

    // --- КЛАСС ФИГУРЫ ---
    class Piece {
        constructor(tetromino, color) {
            this.tetromino = tetromino;
            this.color = color;
            this.activeTetromino = 0;
            this.x = Math.floor(COLS / 2) - 1;
            this.y = 0;
        }
        fill(colorVal){ 
            const matrix = this.tetromino[this.activeTetromino];
            for(let r=0; r<matrix.length; r++){
                for(let c=0; c<matrix[r].length; c++){
                    if(matrix[r][c]) drawSquare(this.x+c, this.y+r, colorVal);
                }
            }
        }
        draw(){ this.fill(this.color); }
        undraw(){ this.fill(0); }
        
        moveDown(){
            if(!this.collision(0, 1, this.activeTetromino)){
                this.undraw(); this.y++; this.draw();
            } else {
                this.lock(); pSweep(); activePiece = createPiece();
            }
        }
        moveLeft(){ if(!this.collision(-1, 0, this.activeTetromino)){ this.undraw(); this.x--; this.draw(); } }
        moveRight(){ if(!this.collision(1, 0, this.activeTetromino)){ this.undraw(); this.x++; this.draw(); } }
        
        rotate(){
            let nextPattern = (this.activeTetromino + 1) % this.tetromino.length;
            let kick = 0;
            if(this.collision(0, 0, nextPattern)) this.x > COLS / 2 ? kick = -1 : kick = 1;
            if(!this.collision(kick, 0, nextPattern)){
                this.undraw(); this.x += kick; this.activeTetromino = nextPattern; this.draw();
            }
        }

        collision(offsetX, offsetY, pattern){
            const matrix = this.tetromino[pattern];
            for(let r=0; r<matrix.length; r++){
                for(let c=0; c<matrix[r].length; c++){
                    if(!matrix[r][c]) continue;
                    let newX = this.x + c + offsetX;
                    let newY = this.y + r + offsetY;
                    if(newX < 0 || newX >= COLS || newY >= ROWS) return true;
                    if(newY < 0) continue;
                    if(board[newY][newX] !== 0) return true;
                }
            }
            return false;
        }

        lock(){
            const matrix = this.tetromino[this.activeTetromino];
            for(let r=0; r<matrix.length; r++){
                for(let c=0; c<matrix[r].length; c++){
                    if(!matrix[r][c]) continue;
                    if(this.y + r < 0) break;
                    board[this.y + r][this.x + c] = this.color;
                }
            }
        }
    }

    function createPiece() {
        const index = Math.floor(Math.random() * PIECES.length);
        return new Piece(PIECES[index][0], PIECES[index][1]);
    }

    // --- ЛОГИКА ИГРЫ ---
    let activePiece = null;
    let dropInterval = 800;
    let lastTime = 0;
    let gameScore = 0;
    let gameActive = false;
    let fallTimer = null;

    function updateScore() {
        scoreDiv.textContent = "ОЧКИ: " + gameScore;
    }

    function checkGameOver() {
        // Проверяем самую верхнюю строку (индекс 0)
        for (let c = 0; c < COLS; c++) {
            if (board[0][c] !== 0) {
                return true;
            }
        }
        return false;
    }

    function endGame() {
        gameActive = false;
        clearInterval(fallTimer);
        
        // Отключаем кнопки
        controls.classList.remove('active');
        controls.classList.add('inactive');
        
        // Показываем окно
        finalScoreSpan.textContent = `ВАШ СЧЕТ: ${gameScore}`;
        gameOverModal.style.display = 'flex';
    }

    function startGameLoop() {
        fallTimer = setInterval(() => {
            if (gameActive) moveDown();
        }, dropInterval);
    }

    function setupNewGame() {
        // Чистим доску
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                board[r][c] = 0;
            }
        }
        
        gameScore = 0;
        updateScore();
        
        activePiece = createPiece();
        
        // ВАЖНО: Проверка ДО запуска цикла
        if (checkGameOver()) {
            endGame();
            return;
        }

        gameActive = true;
        requestAnimationFrame(gameLoop);
        startGameLoop();
    }

    function gameLoop(timeStamp = 0) {
        try {
            const deltaTime = timeStamp - lastTime;
            if (deltaTime > dropInterval) {
                lastTime = timeStamp;
            }
            drawBoard();
            if (activePiece) activePiece.draw();
            requestAnimationFrame(gameLoop);
        } catch(e) {}
    }

    function moveDown() { if(activePiece) activePiece.moveDown(); }
    function moveLeft() { if(activePiece) activePiece.moveLeft(); }
    function moveRight() { if(activePiece) activePiece.moveRight(); }
    function rotatePiece() { if(activePiece) activePiece.rotate(); }

    function pSweep() {
        let rowCount = 0;
        for (let r = 0; r < ROWS; r++) {
            let isRowFull = true;
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] === 0) { isRowFull = false; break; }
            }
            if (isRowFull) {
                for (let y = r; y > 0; y--) {
                    for (let c = 0; c < COLS; c++) {
                        board[y][c] = board[y-1][c];
                    }
                }
                for (let c = 0; c < COLS; c++) { board[0][c] = 0; }
                rowCount++;
            }
        }
        if (rowCount > 0) {
            gameScore += rowCount * 10;
            updateScore();
        }
    }

    // --- УПРАВЛЕНИЕ ВИДОМ ---
    function resetGame() {
        gameOverModal.style.display = 'none';
        controls.classList.remove('inactive');
        controls.classList.add('active');
        setupNewGame();
    }

    // Автоматический старт первой партии
    setupNewGame();

} catch (e) {
    console.error("Fatal Error:", e);
}
</script>

</body>
</html>
