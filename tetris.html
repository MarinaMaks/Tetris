<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        #score {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            z-index: 50;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid lime;
            border-radius: 10px;
        }

        canvas {
            border: 3px solid lime;
            image-rendering: pixelated;
            max-width: 95vw;
            max-height: 80vh;
            box-sizing: border-box;
            z-index: 10;
        }

        .controls-mobile {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 15px;
            z-index: 20;
            pointer-events: none;
        }
        .control-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid white;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 28px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            pointer-events: all;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.4); }

        #error-log {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(100, 0, 0, 0.9);
            color: red;
            padding: 20px;
            border: 2px solid red;
            border-radius: 10px;
            text-align: center;
            line-height: 1.4;
            z-index: 100;
            display: none;
            max-width: 80%;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="score">ОЧКИ: 0</div>
<canvas id="gameCanvas"></canvas>
<div class="controls-mobile">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>
<div id="error-log"></div>

<script>
window.onerror = function(message, source, lineno, colno, error) {
    const log = document.getElementById('error-log');
    log.style.display = 'block';
    log.innerHTML = '<b>Ошибка выполнения:</b><br>' + message + '<br>Строка: ' + lineno;
};

try {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDiv = document.getElementById('score');
    const ROWS = 20;
    const COLS = 10;
    let SQ;

    function resizeCanvas() {
        const w = window.innerWidth * 0.9;
        SQ = Math.max(20, Math.floor(w / COLS));
        canvas.width = COLS * SQ;
        canvas.height = ROWS * SQ;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // --- ПОЛЕ ---
    let board = [];
    for (let r = 0; r < ROWS; r++) {
        board[r] = new Array(COLS).fill(0);
    }

    /* 
       КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ:
       Теперь форма и цвет идут строго парой в одном вложенном массиве.
       Ошибка "undefined.length" возникала потому, что раньше мы брали случайный индекс для цвета 
       отдельно от индекса для формы, и они могли не совпасть или вернуть пустой объект.
    */
    const PIECES = [
        [ [[2,2,0],[0,2,2],[0,0,0]], "red"],           // Z
        [ [[0,2,2],[2,2,0],[0,0,0]], "lime"],          // S
        [ [[0,2,0],[2,2,2],[0,0,0]], "yellow"],        // T
        [ [[2,2],[2,2]], "blue"],                      // O
        [ [[0,0,2],[2,2,2],[0,0,0]], "purple"],        // L
        [ [[0,0,0,0],[2,2,2,2],[0,0,0,0],[0,0,0,0]], "cyan"], // I
        [ [[2,0,0],[2,2,2],[0,0,0]], "orange"]         // J
    ];

    // --- РИСОВАНИЕ ---
    function drawSquare(x, y, color){
        if (!ctx) return;
        ctx.fillStyle = color === 0 ? '#000' : color;
        ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
    }
    function drawBoard(){
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                drawSquare(c, r, board[r][c]);
            }
        }
    }

    // --- КЛАСС ФИГУРЫ ---
    class Piece {
        constructor(tetromino, color) {
            this.tetromino = tetromino;
            this.color = color;
            this.activeTetromino = 0;
            this.x = Math.floor(COLS / 2) - 1;
            this.y = 0;
        }
        fill(colorVal){ 
            try {
                const matrix = this.tetromino[this.activeTetromino];
                if (!matrix) return;
                for(let r=0; r<matrix.length; r++){
                    for(let c=0; c<matrix[r].length; c++){
                        if(matrix[r][c]) drawSquare(this.x+c, this.y+r, colorVal);
                    }
                }
            } catch(e) {
                console.error("Ошибка при рисовании:", e);
            }
        }
        draw(){ this.fill(this.color); }
        undraw(){ this.fill(0); }
        moveDown(){
            if(!this.collision(0, 1, this.activeTetromino)){
                this.undraw(); this.y++; this.draw();
            } else {
                this.lock(); pSweep(); activePiece = createPiece();
            }
        }
        moveLeft(){ if(!this.collision(-1, 0, this.activeTetromino)){ this.undraw(); this.x--; this.draw(); } }
        moveRight(){ if(!this.collision(1, 0, this.activeTetromino)){ this.undraw(); this.x++; this.draw(); } }
        rotate(){
            let nextPattern = (this.activeTetromino + 1) % this.tetromino.length;
            let kick = 0;
            if(this.collision(0, 0, nextPattern)) this.x > COLS / 2 ? kick = -1 : kick = 1;
            if(!this.collision(kick, 0, nextPattern)){
                this.undraw(); this.x += kick; this.activeTetromino = nextPattern; this.draw();
            }
        }
        collision(offsetX, offsetY, pattern){
            try {
                const matrix = this.tetromino[pattern];
                if (!matrix) return true;
                for(let r=0; r<matrix.length; r++){
                    for(let c=0; c<matrix[r].length; c++){
                        if(!matrix[r][c]) continue;
                        let newX = this.x + c + offsetX;
                        let newY = this.y + r + offsetY;
                        if(newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if(newY < 0) continue;
                        if(board[newY][newX] !== 0) return true;
                    }
                }
                return false;
            } catch(e) { return true; }
        }
        lock(){
            try {
                const matrix = this.tetromino[this.activeTetromino];
                if (!matrix) return;
                for(let r=0; r<matrix.length; r++){
                    for(let c=0; c<matrix[r].length; c++){
                        if(!matrix[r][c]) continue;
                        if(this.y + r < 0) break;
                        board[this.y + r][this.x + c] = this.color;
                    }
                }
            } catch(e) {}
        }
    }

    // ФУНКЦИЯ СОЗДАНИЯ (теперь берет пару целиком)
    function createPiece() {
        try {
            const index = Math.floor(Math.random() * PIECES.length);
            const shapeAndColor = PIECES[index];
            
            // Защита: если по какой-то причине элемент массива битый
            if (!shapeAndColor || !shapeAndColor[0]) {
                throw new Error("Не удалось создать фигуру");
            }
            
            return new Piece(shapeAndColor[0], shapeAndColor[1]);
        } catch(e) {
            console.error(e);
            // Если создание сломалось, создаем простую палку вручную, чтобы игра не встала
            return new Piece([[[2,2,2,2]]], "white"); 
        }
    }

    // --- ЛОГИКА ИГРЫ ---
    let activePiece = createPiece();
    let dropInterval = 800;
    let lastTime = 0;
    let gameScore = 0;

    function updateScore() {
        scoreDiv.textContent = "ОЧКИ: " + gameScore;
    }

    function gameLoop(timeStamp = 0) {
        try {
            const deltaTime = timeStamp - lastTime;
            if (deltaTime > dropInterval) {
                moveDown();
                lastTime = timeStamp;
            }
            drawBoard();
            activePiece.draw();
            requestAnimationFrame(gameLoop);
        } catch(e) {
            console.error("Критическая ошибка цикла:", e);
        }
    }

    function moveDown() { activePiece.moveDown(); }
    function moveLeft() { activePiece.moveLeft(); }
    function moveRight() { activePiece.moveRight(); }
    function rotatePiece() { activePiece.rotate(); }

    function pSweep() {
        let rowCount = 0;
        for (let r = 0; r < ROWS; r++) {
            let isRowFull = true;
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] === 0) { isRowFull = false; break; }
            }
            if (isRowFull) {
                for (let y = r; y > 0; y--) {
                    for (let c = 0; c < COLS; c++) {
                        board[y][c] = board[y-1][c];
                    }
                }
                for (let c = 0; c < COLS; c++) { board[0][c] = 0; }
                rowCount++;
            }
        }
        if (rowCount > 0) {
            gameScore += rowCount * 10;
            updateScore();
        }
    }

    // Запускаем игру
    requestAnimationFrame(gameLoop);

} catch (e) {
    document.getElementById('error-log').style.display = 'block';
    document.getElementById('error-log').innerText = "Фатальная ошибка загрузки:\n" + e.message;
}
</script>

</body>
</html>
