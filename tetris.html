<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис - Мобильная версия</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        body { 
            margin: 0; background-color: #000; color: white; font-family: 'Courier New', monospace; 
            display: flex; justify-content: center; align-items: flex-start; height: 100vh; overflow: hidden; position: relative;
            padding-top: 40px; 
        }
        
        canvas {
            border: 4px solid lime;
            image-rendering: pixelated;
            width: 360px;
            height: 580px;
            box-sizing: border-box;
            z-index: 10;
            background-color: #000;
        }

        .controls-mobile {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: auto auto auto; gap: 15px; z-index: 20;
            pointer-events: none; transition: opacity 0.3s;
        }
        .controls-mobile.active { pointer-events: all; opacity: 1; }
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%; 
            border: 3px solid white; background: rgba(255,255,255,0.2); 
            color: white; font-size: 24px; cursor: pointer;
        }
        .control-btn:active { background: rgba(255,255,255,0.4); }

        /* --- МОДАЛЬНОЕ ОКНО ДЛЯ МОБИЛЬНЫХ --- */
        #game-over-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 0, 0, 0.95); color: white; z-index: 100; 
            display: none; text-align: center; width: 95vw; max-width: 380px; 
            padding: 15px 10px 20px 10px;
            border-radius: 15px;
            
            /* Flex для вертикальной укладки блоков */
            display: flex;
            flex-direction: column;
            gap: 12px; /* Расстояние между красными блоками */
        }

        /* Красные блоки для текста */
        .modal-block {
            border: 2px solid red;
            border-radius: 8px;
            padding: 12px 8px;
            background: rgba(20, 0, 0, 0.7);
        }
        
        .modal-title { 
            font-size: 24px; letter-spacing: 2px; text-shadow: 0 0 5px red;
        }
        .score-display { font-size: 20px; color: cyan; }
        
        .rating-container h3 { 
            font-size: 16px; margin-bottom: 6px; color: white; text-transform: uppercase; letter-spacing: 1px;
        }
        #rating-list { 
            list-style: decimal inside; 
            color: #0f0; 
            text-align: left; 
            padding-left: 0; 
            max-height: 140px; /* Занимает больше всего места */
            overflow-y: auto; 
            margin: 0;
            font-size: 16px;
        }
        #rating-list li { margin-bottom: 4px; }

        /* Кнопка БЕЗ КРАСНОЙ РАМКИ, растянутая на всю ширину */
        #restart-btn-final {
            width: 100%;
            padding: 16px 0; 
            background: lime; 
            color: black; 
            border: none;
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 2px 0 darkgreen;
        }
        #restart-btn-final:hover { filter: brightness(1.1); }

        #score { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 24px; z-index: 50; padding: 10px 20px; background: rgba(0,0,0,0.7); border: 2px solid lime; border-radius: 10px; }
    </style>
</head>
<body>

<div id="score">ОЧКИ: 0</div>
<canvas id="gameCanvas"></canvas>
<div class="controls-mobile inactive" id="controls">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>

<!-- ИНТЕРФЕЙС КОНЦА ИГРЫ -->
<div id="game-over-modal">
    
    <!-- Блок 1: Заголовок (Маленький) -->
    <div class="modal-block title-block">
        <div class="modal-title">КОНЕЦ ИГРЫ</div>
    </div>
    
    <!-- Блок 2: Счет (Маленький) -->
    <div class="modal-block score-block">
        <div class="score-display" id="final-score"></div>
    </div>
    
    <!-- Блок 3: Рейтинг (Большой + Прокрутка) -->
    <div class="modal-block rating-block">
        <h3>ТОП-5 РЕЗУЛЬТАТОВ:</h3>
        <ol id="rating-list"></ol>
    </div>
    
    <!-- Элемент 4: Кнопка (Без рамки, снизу) -->
    <button id="restart-btn-final" onclick="resetGame()">Играть снова</button>
    
</div>

<script defer>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');
const gameOverModal = document.getElementById('game-over-modal');
const finalScoreSpan = document.getElementById('final-score');
const ratingList = document.getElementById('rating-list');
const controls = document.getElementById('controls');

// --- НАСТРОЙКИ ---
const ROWS = 20;
const COLS = 10;
const SQ = 32; 
canvas.width = COLS * SQ;
canvas.height = ROWS * SQ;

let board = [];
for(let r=0; r<ROWS; r++){ board[r] = new Array(COLS).fill(0); }

// --- ФИГУРЫ ---
const SHAPES = [
    {coords: [[0,0],[1,0],[1,1],[2,1]], color: 'red'},           // Z
    {coords: [[0,1],[0,2],[1,0],[1,1]], color: 'blue'},          // L
    {coords: [[0,0],[0,1],[1,1],[2,1]], color: 'lime'},          // Гамма
    {coords: [[0,0],[0,1],[1,0],[1,1]], color: 'yellow'},        // Куб
    {coords: [[0,0],[1,0],[2,0],[3,0]], color: 'cyan'},          // Палка
    {coords: [[0,0],[1,0],[2,0],[1,1]], color: 'purple'},        // Т
    {coords: [[1,0],[2,0],[0,1],[1,1]], color: 'orange'}         // S
];

// --- ОТРИСОВКА ---
function drawRect(x, y, color){
    if(!ctx) return;
    ctx.fillStyle = color;
    ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
}
function drawBoard(){
    for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
            if(board[r][c]) drawRect(c, r, board[r][c]);
        }
    }
}

// --- ОБЪЕКТ ФИГУРЫ ---
let activePiece = null;
let lastDrop = 0;
let dropSpeed = 800; 
let gameScore = 0;
let gameActive = false;

function createPiece(){
    const index = Math.floor(Math.random() * SHAPES.length);
    const shape = SHAPES[index];
    return { x: Math.floor(COLS / 2) - 2, y: -2, coords: shape.coords, color: shape.color };
}

function drawPiece(piece){
    piece.coords.forEach(block => {
        let px = piece.x + block[0];
        let py = piece.y + block[1];
        if(px >= 0 && py >= 0 && px < COLS && py < ROWS){
            drawRect(px, py, piece.color);
        }
    });
}

// Проверка столкновений
function checkCollision(piece, offsetX, offsetY){
    for(let i=0; i<piece.coords.length; i++){
        let px = piece.x + piece.coords[i][0] + offsetX;
        let py = piece.y + piece.coords[i][1] + offsetY;
        if(px < 0 || px >= COLS || py >= ROWS) return true;
        if(py >= 0 && board[py][px]) return true;
    }
    return false;
}

// --- ВРАЩЕНИЕ (360 градусов) ---
function rotateCoords(coords){
    let minX = Math.min(...coords.map(p=>p[0]));
    let maxX = Math.max(...coords.map(p=>p[0]));
    let minY = Math.min(...coords.map(p=>p[1]));
    let maxY = Math.max(...coords.map(p=>p[1]));
    
    let w = maxX - minX + 1;
    let h = maxY - minY + 1;
    
    let matrix = Array.from({length: h}, () => Array(w).fill(0));
    coords.forEach(b => {
        let mx = b[0] - minX;
        let my = b[1] - minY;
        matrix[my][mx] = 1;
    });
    
    let rotatedMatrix = matrix[0].map((val, idx) => matrix.map(row => row[idx]).reverse());
    
    let newCoords = [];
    for(let r=0; r<rotatedMatrix.length; r++){
        for(let c=0; c<rotatedMatrix[r].length; c++){
            if(rotatedMatrix[r][c]){
                newCoords.push([c + minX, r + minY]); 
            }
        }
    }
    
    let cx = newCoords.reduce((a,b)=>a+b[0], 0)/newCoords.length;
    let cy = newCoords.reduce((a,b)=>a+b[1], 0)/newCoords.length;
    return newCoords.map(p => [Math.round(p[0]-cx), Math.round(p[1]-cy)]);
}

function applyKick(current, rotated){
    let dx = 0;
    if(checkCollision({...activePiece, coords: rotated}, 0, 0)) return false;
    
    while(activePiece.x + Math.max(...rotated.map(p=>p[0])) >= COLS){ dx--; if(checkCollision({...activePiece, coords: rotated}, dx, 0)){ dx++; break; } }
    while(activePiece.x + Math.min(...rotated.map(p=>p[0])) < 0){ dx++; if(checkCollision({...activePiece, coords: rotated}, dx, 0)){ dx--; break; } }
    
    activePiece.x += dx;
    activePiece.coords = rotated;
    return true;
}

function rotatePiece(){
    if(!activePiece) return;
    let rotated = rotateCoords(activePiece.coords);
    applyKick(activePiece.coords, rotated);
}

// --- ЛОГИКА ДВИЖЕНИЯ ---
function moveDown(){
    if(Date.now() - lastDrop > dropSpeed){
        lastDrop = Date.now();
        if(!checkCollision(activePiece, 0, 1)){
            activePiece.y++;
        } else {
            lockPiece(); clearLines(); 
            activePiece = createPiece();
            if(checkCollision(activePiece, 0, 0)) endGame();
        }
    }
}
function moveLeft(){ if(!checkCollision(activePiece, -1, 0)) activePiece.x--; }
function moveRight(){ if(!checkCollision(activePiece, 1, 0)) activePiece.x++; }

// --- ЗАМОРОЗКА И ОЧИСТКА ---
function lockPiece(){
    activePiece.coords.forEach(block => {
        let px = activePiece.x + block[0];
        let py = activePiece.y + block[1];
        if(py >= 0) board[py][px] = activePiece.color;
    });
}
function clearLines(){
    let rowCount = 0;
    outer: for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){ if(!board[r][c]) continue outer; }
        board.splice(r, 1);
        board.unshift(new Array(COLS).fill(0));
        rowCount++;
    }
    if(rowCount > 0){
        gameScore += rowCount * 10;
        updateScore();
    }
}

// --- РЕЙТИНГ ---
function saveScore(score){ let scores = JSON.parse(localStorage.getItem('tetrisRating')) || []; scores.push(score); scores.sort((a,b)=> b - a); localStorage.setItem('tetrisRating', JSON.stringify(scores.slice(0,5))); }
function renderScores(){ ratingList.innerHTML = ''; let scores = JSON.parse(localStorage.getItem('tetrisRating')) || []; scores.forEach(s=>{ let li=document.createElement('li'); li.textContent=s; ratingList.appendChild(li); }); }

// --- ЦИКЛ ИГРЫ ---
function gameLoop(timeStamp){
    if(!gameActive) return;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawBoard(); drawPiece(activePiece);
    requestAnimationFrame(gameLoop);
    moveDown();
}

// --- УПРАВЛЕНИЕ СОСТОЯНИЕМ ---
function startGame(){
    gameActive = true;
    activePiece = createPiece();
    updateScore(); renderScores();
    requestAnimationFrame(gameLoop);
    controls.classList.remove('inactive'); controls.classList.add('active');
}
function endGame(){
    gameActive = false;
    saveScore(gameScore);
    finalScoreSpan.textContent = `ВАШ СЧЕТ: ${gameScore}`;
    renderScores();
    gameOverModal.style.display = 'flex';
    controls.classList.remove('active'); controls.classList.add('inactive');
}
function resetGame(){
    gameOverModal.style.display = 'none';
    board = []; for(let r=0; r<ROWS; r++) board[r] = new Array(COLS).fill(0);
    gameScore = 0;
    startGame();
}
function updateScore(){
    scoreDiv.textContent = "ОЧКИ: " + gameScore;
}

document.addEventListener('DOMContentLoaded', startGame);

</script>

</body>
</html>
