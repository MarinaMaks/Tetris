<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тетрис - Финал</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <style>
        body { 
            margin: 0; background-color: #000; color: white; font-family: monospace; 
            display: flex; justify-content: center; align-items: flex-start; height: 100vh; overflow: hidden; position: relative;
            padding-top: 20px; /* Поднимаем всё поле от верхнего края */
        }
        
        canvas {
            border: 4px solid lime;
            image-rendering: pixelated;
            width: 360px;
            height: 640px;
            box-sizing: border-box;
            z-index: 10;
            background-color: #000;
        }

        .controls-mobile {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: auto auto auto; gap: 15px; z-index: 20;
            pointer-events: none; transition: opacity 0.3s;
        }
        .controls-mobile.active { pointer-events: all; opacity: 1; }
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%; 
            border: 3px solid white; background: rgba(255,255,255,0.2); 
            color: white; font-size: 24px; cursor: pointer;
        }
        .control-btn:active { background: rgba(255,255,255,0.4); }

        #game-over-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(50,0,0,0.95); color: red; padding: 30px; border: 3px solid red; z-index: 100; display: none;
            text-align: center; max-width: 90vw;
        }
        #score { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 24px; z-index: 50; padding: 10px 20px; background: rgba(0,0,0,0.7); border: 2px solid lime; border-radius: 10px; }
        #rating-list { list-style: decimal inside; color: cyan; text-align: left; padding-left: 0; max-height: 150px; overflow-y: auto; }
        #rating-list li { margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="score">ОЧКИ: 0</div>
<canvas id="gameCanvas"></canvas>
<div class="controls-mobile inactive" id="controls">
    <button class="control-btn" onclick="moveLeft()">←</button>
    <button class="control-btn" onclick="rotatePiece()">⟳</button>
    <button class="control-btn" onclick="moveRight()">→</button>
</div>
<div id="game-over-modal">
    <h2 style="margin:0;">КОНЕЦ ИГРЫ</h2>
    <p id="final-score"></p>
    <h3>ТОП-5:</h3>
    <ol id="rating-list"></ol>
    <button onclick="resetGame()" style="margin-top:15px;padding:12px 25px;background:lime;color:black;border:none;font-weight:bold;cursor:pointer;">ИГРАТЬ СНОВА</button>
</div>

<script defer>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');
const gameOverModal = document.getElementById('game-over-modal');
const finalScoreSpan = document.getElementById('final-score');
const ratingList = document.getElementById('rating-list');
const controls = document.getElementById('controls');

// --- НАСТРОЙКИ ---
const ROWS = 20;
const COLS = 10;
const SQ = 32; 
canvas.width = COLS * SQ;
canvas.height = ROWS * SQ;

let board = [];
for(let r=0; r<ROWS; r++){ board[r] = new Array(COLS).fill(0); }

// --- ФИГУРЫ (Координаты блоков) ---
const SHAPES = [
    {coords: [[0,0],[1,0],[1,1],[2,1]], color: 'red'},           // Z
    {coords: [[0,1],[0,2],[1,0],[1,1]], color: 'blue'},          // L
    {coords: [[0,0],[0,1],[1,1],[2,1]], color: 'lime'},          // Гамма
    {coords: [[0,0],[0,1],[1,0],[1,1]], color: 'yellow'},        // Куб
    {coords: [[0,0],[1,0],[2,0],[3,0]], color: 'cyan'},          // Палка
    {coords: [[0,0],[1,0],[2,0],[1,1]], color: 'purple'},        // Т
    {coords: [[1,0],[2,0],[0,1],[1,1]], color: 'orange'}         // S
];

// --- ОТРИСОВКА ---
function drawRect(x, y, color){
    if(!ctx) return;
    ctx.fillStyle = color;
    ctx.fillRect(x * SQ, y * SQ, SQ, SQ);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x * SQ, y * SQ, SQ, SQ);
}
function drawBoard(){
    for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
            if(board[r][c]) drawRect(c, r, board[r][c]);
        }
    }
}

// --- ОБЪЕКТ ФИГУРЫ ---
let activePiece = null;
let dropSpeed = 800; 
let lastDrop = 0;
let gameScore = 0;
let gameActive = false;

function createPiece(){
    const index = Math.floor(Math.random() * SHAPES.length);
    const shape = SHAPES[index];
    return { x: Math.floor(COLS / 2) - 2, y: 0, coords: shape.coords, color: shape.color };
}

function drawPiece(piece){
    piece.coords.forEach(block => {
        let px = piece.x + block[0];
        let py = piece.y + block[1];
        if(px >= 0 && py >= 0 && px < COLS && py < ROWS){
            drawRect(px, py, piece.color);
        }
    });
}

// Проверка столкновений
function checkCollision(piece, offsetX, offsetY){
    for(let i=0; i<piece.coords.length; i++){
        let px = piece.x + piece.coords[i][0] + offsetX;
        let py = piece.y + piece.coords[i][1] + offsetY;
        if(px < 0 || px >= COLS || py >= ROWS) return true;
        if(py >= 0 && board[py][px]) return true;
    }
    return false;
}

// --- ВРАЩЕНИЕ (Матрица поворота 90 градусов) ---
function rotateCoords(coords){
    let maxSize = 4;
    let matrix = Array.from({length: maxSize}, () => Array(maxSize).fill(0));
    
    // Рисуем фигуру во временную матрицу
    coords.forEach(b => matrix[b[1]][b[0]] = 1);
    
    // Поворачиваем матрицу (транспонирование + реверс строк)
    let rotated = matrix[0].map((val, index) => 
        matrix.map(row => row[index]).reverse()
    );
    
    // Собираем новые координаты из повернутой матрицы
    let newCoords = [];
    for(let r=0; r<maxSize; r++){
        for(let c=0; c<maxSize; c++){
            if(rotated[r][c]) newCoords.push([c, r]);
        }
    }
    
    // Центрируем фигуру относительно её центра масс
    let offsetX = Math.floor(newCoords.length / 2);
    return newCoords.map(p => [p[0] - offsetX, p[1]]);
}

// --- ЛОГИКА ДВИЖЕНИЯ ---
function moveDown(){
    if(Date.now() - lastDrop > dropSpeed){
        lastDrop = Date.now();
        if(!checkCollision(activePiece, 0, 1)){
            activePiece.y++;
        } else {
            lockPiece(); clearLines(); 
            activePiece = createPiece();
            if(checkCollision(activePiece, 0, 0)) endGame();
        }
    }
}
function moveLeft(){ if(!checkCollision(activePiece, -1, 0)) activePiece.x--; }
function moveRight(){ if(!checkCollision(activePiece, 1, 0)) activePiece.x++; }
function rotatePiece(){
    let rotated = rotateCoords(activePiece.coords);
    let kick = 0;
    if(checkCollision({...activePiece, coords: rotated}, 0, 0)){
        activePiece.x > COLS/2 ? kick = -1 : kick = 1;
    }
    if(!checkCollision({...activePiece, coords: rotated}, kick, 0)){
        activePiece.coords = rotated;
        activePiece.x += kick;
    }
}

// --- ЗАМОРОЗКА И ОЧИСТКА ---
function lockPiece(){
    activePiece.coords.forEach(block => {
        let px = activePiece.x + block[0];
        let py = activePiece.y + block[1];
        if(py >= 0) board[py][px] = activePiece.color;
    });
}
function clearLines(){
    let rowCount = 0;
    outer: for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){ if(!board[r][c]) continue outer; }
        board.splice(r, 1);
        board.unshift(new Array(COLS).fill(0));
        rowCount++;
    }
    if(rowCount > 0){
        gameScore += rowCount * 10;
        updateScore();
    }
}

// --- РЕЙТИНГ ---
function saveScore(score){
    let scores = JSON.parse(localStorage.getItem('tetrisRating')) || [];
    scores.push(score);
    scores.sort((a,b)=> b - a);
    localStorage.setItem('tetrisRating', JSON.stringify(scores.slice(0,5)));
}
function renderScores(){
    ratingList.innerHTML = '';
    let scores = JSON.parse(localStorage.getItem('tetrisRating')) || [];
    scores.forEach(s => {
        let li = document.createElement('li');
        li.textContent = s;
        ratingList.appendChild(li);
    });
}

// --- ЦИКЛ ИГРЫ ---
function gameLoop(timeStamp){
    if(!gameActive) return;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawBoard(); drawPiece(activePiece);
    requestAnimationFrame(gameLoop);
    moveDown();
}

// --- УПРАВЛЕНИЕ СОСТОЯНИЕМ ---
function startGame(){
    gameActive = true;
    activePiece = createPiece();
    updateScore(); renderScores();
    requestAnimationFrame(gameLoop);
    controls.classList.remove('inactive'); controls.classList.add('active');
}
function endGame(){
    gameActive = false;
    saveScore(gameScore);
    finalScoreSpan.textContent = `ВАШ СЧЕТ: ${gameScore}`;
    renderScores();
    gameOverModal.style.display = 'flex';
    controls.classList.remove('active'); controls.classList.add('inactive');
}
function resetGame(){
    gameOverModal.style.display = 'none';
    board = []; for(let r=0; r<ROWS; r++) board[r] = new Array(COLS).fill(0);
    gameScore = 0;
    startGame();
}
function updateScore(){
    scoreDiv.textContent = "ОЧКИ: " + gameScore;
}

// --- СТАРТ ---
document.addEventListener('DOMContentLoaded', startGame);

</script>

</body>
</html>
